# Checks on every push and pull request; images to GHCR from the default branch. The release
# version is the "version" in the root package.json: when it isn't in GHCR yet, the image is
# also tagged X.Y.Z, X.Y and latest. Bump it to release.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format (Biome)
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end test
        run: pnpm e2e
      - name: Keep Playwright traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  image:
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: Version from package.json
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/papyrus
        run: |
          version=$(node -p "require('./package.json').version")
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if docker manifest inspect "$image:$version" > /dev/null 2>&1; then
            echo "$version is already published; this build is tagged main and sha-* only."
            release=false
            app_version="$version+${GITHUB_SHA::7}"
          else
            release=true
            app_version="$version"
          fi
          # A prerelease (0.2.0-beta.1) gets its own tag but doesn't move X.Y or latest.
          stable=$release
          [[ "$version" == *-* ]] && stable=false
          {
            echo "version=$version"
            echo "minor=$(echo "$version" | cut -d. -f1-2)"
            echo "release=$release"
            echo "stable=$stable"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/papyrus
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PAPYRUS_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
